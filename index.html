/* Family tree redesigned around Elchanan, not surname groups */
.tree{display:flex;flex-direction:column;gap:14px}
.tree-generation{direction:ltr;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:stretch}
.tree-lane{min-width:0;border:1px solid #12442f;border-radius:12px;padding:10px;background:#03100b80}
.tree-lane-title,.tree-row-title{color:var(--neon);text-align:center;font-size:12px;font-weight:700;margin:0 0 9px}
.tree-lane .generation{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:8px}
.tree-lane .person{width:min(100%,190px)}
.tree-parents{direction:ltr;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:650px;margin:0 auto;width:100%}
.tree-parents .family-group{min-width:0}
.tree-focus{border:1px solid #31f5a0;border-radius:14px;padding:12px;background:#062016;display:flex;flex-direction:column;align-items:center;gap:10px}
.tree-focus .generation{width:100%;justify-content:center}
.tree-focus .person[data-person="אלחנן פזואלו"]{order:0}
.tree-focus .tree-row-title{margin-bottom:0}
.tree-arrow{text-align:center;color:var(--neon);opacity:.7;font-size:18px;line-height:1}
.tree-ancestors{direction:ltr;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tree-ancestors .family-group,.tree-parents .family-group{background:#03100b80}
.tree-cousins{direction:ltr;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tree-empty-note{color:var(--muted);text-align:center;font-size:12px;padding:10px}
@media(max-width:560px){
 .tree-generation,.tree-ancestors,.tree-cousins{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}
 .tree-lane,.tree-ancestors .family-group,.tree-parents .family-group{padding:6px}
 .tree-lane-title,.tree-row-title{font-size:11px}
 .tree-lane .person,.tree .person{width:100%;padding:7px;gap:5px}
 .tree .person img,.tree .person .placeholder{width:30px;height:30px}
 .tree .pname{font-size:11px}
 .tree .prole{font-size:9px}
}
.dual-tree{display:grid;grid-template-columns:1fr 1fr;gap:12px;direction:ltr}.dual-tree>.tree-lane{min-width:0}.dual-tree .tree-lane{margin-bottom:10px}.couple-row{display:flex;align-items:center;justify-content:center;gap:10px}.married{color:#f0d28a;border:1px solid #806d36;border-radius:20px;padding:7px 12px;white-space:nowrap}.tree-focus{margin-top:12px;border:1px solid var(--neon);border-radius:14px;padding:12px;background:#062016}.tree-focus .person{max-width:210px}.tree-lane .generation{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}.tree-lane .person{width:100%;max-width:220px}.side-nav button:hover{box-shadow:0 0 15px #31f5a055;border-color:var(--neon)}@media(max-width:760px){.wrap{grid-template-columns:76px minmax(0,1fr) 250px;min-width:980px;padding:8px}.side-nav button{font-size:10px;padding:10px 3px}}

let selected='הראל הנדי';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanValue=v=>{if(v===null||v===undefined)return '';let s=String(v).trim();return !s||['אין','(אין)','לא נמצא','לא ידוע','-','0','00/00/0000'].includes(s)?'':s};
function buttonPerson(n,role=''){return `<button class="person ${n===selected?'selected':''}" data-person="${esc(n)}"><span class="placeholder mini">♙</span><span><span class="pname">${esc(n)}</span><span class="prole">${esc(role||'פרטים מתועדים')}</span></span></button>`}
function cards(arr,role){return (arr||[]).filter(n=>people[n]).map(n=>buttonPerson(n,role)).join('')||'<div class="tree-empty-note">לא נמצאו קשרים מתועדים</div>'}
function lane(title,arr,role){return `<section class="tree-lane"><div class="tree-lane-title">${title}</div><div class="generation">${cards(arr,role)}</div></section>`}
function renderTree(){
 const f=families[selected]||families['הראל הנדי'];
 const title=selected==='רויטל רבקה הנדי'?'רויטל הנדי':'הראל הנדי';
 const section=(label,arr,role)=>`<section class="tree-section"><h3>${label}</h3><div class="generation">${cards(arr,role)}</div></section>`;
 const center=`<div class="tree-center"><div class="tree-row-title">${esc(title)} · האדם המרכזי</div><div class="generation">${buttonPerson(selected,'האדם המרכזי')}</div></div>`;
 document.getElementById('tree').innerHTML=`${section('סבא וסבתא',f.grandparents,'סבא / סבתא')}${section('דודים ודודות',f.uncles,'דוד / דודה')}${section('בני דודים',f.cousins,'בן / בת דוד')}${section('הורים',f.parents,'הורה')}${center}${section('אחים ואחיות',f.siblings,'אח / אחות')}${section('ילדים',people[selected]?.children||[],'ילד / ילדה')}${section('ילדים',people[selected]?.children||[],'ילד / ילדה')}`;
}
function field(label,value){const v=cleanValue(value);return v?`<div class="field"><label>${label}</label><div>${esc(v)}</div></div>`:''}
function renderProfile(){const p=people[selected];if(!p)return;const addressYear=['הראל הנדי','רויטל רבקה הנדי'].includes(p.name)?'2020':'2006';document.getElementById('profile').innerHTML=`<div class="profile-top"><div class="portrait blank">♙</div><div class="person-name">${esc(p.name)}</div></div><div class="section-title">פרטים אישיים</div><div class="fields">${field('תעודת זהות',p.id)}${field('טלפון',p.phone)}${field('תאריך לידה',p.birth)}${field('כתובת (נתוני '+addressYear+')',p.address)}${field('עיר',p.city)}</div><div class="section-title">קשרים משפחתיים מתועדים</div>${field('הורים',(p.parents||[]).join(' · '))}${field('אחים ואחיות',(p.siblings||[]).join(' · '))}${field('ילדים',(p.children||[]).join(' · '))}${field('מקורות מידע',(p.sources||[]).join(' · '))}${field('ראיות לקשרים',(p.evidence||[]).join(' · '))}`}
function selectPerson(n){if(!people[n])return;const previous=selected;selected=n;renderProfile();selected=previous;document.getElementById('searchResults').classList.add('hidden')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-person]');if(b)selectPerson(b.dataset.person)});
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase(),box=document.getElementById('searchResults');if(!q){box.classList.add('hidden');return}const hits=Object.keys(people).filter(n=>n.toLowerCase().includes(q)).slice(0,20);box.innerHTML=hits.length?hits.map(n=>`<button class="result" data-person="${esc(n)}">${esc(n)}</button>`).join(''):'<div class="empty">לא נמצא אדם</div>';box.classList.remove('hidden')});
document.getElementById('focusCenter').addEventListener('click',()=>document.getElementById('tree').scrollIntoView({behavior:'smooth',block:'nearest'}));
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.nav==='search')document.getElementById('search').focus();else if(b.dataset.nav==='people')document.getElementById('profile').scrollIntoView({behavior:'smooth'});else if(b.dataset.nav==='tree')document.getElementById('tree').scrollIntoView({behavior:'smooth'})}));
function openCenter(n){if(!families[n])return;selected=n;document.body.classList.remove('home');document.querySelector('.sub').textContent='עץ משפחה · '+n;renderTree();renderProfile();window.scrollTo(0,0)}
document.querySelectorAll('[data-open-center]').forEach(b=>b.addEventListener('click',()=>openCenter(b.dataset.openCenter)));
document.getElementById('backHome').addEventListener('click',()=>{document.body.classList.add('home');document.querySelector('.sub').textContent='עץ משפחה · משפחת הנדי';document.getElementById('search').value='';document.getElementById('searchResults').classList.add('hidden');window.scrollTo(0,0)});
document.body.classList.add('home');
